name: NexVigil CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  security-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: Bandit SAST
        run: bandit -r app detection_engine scripts

      - name: Dependency audit
        run: pip-audit -r requirements.txt
